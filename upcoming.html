<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upcoming Trips</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .scroll-reveal {
      opacity: 0;
      transform: translateY(60px) scale(0.96);
      transition: all 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .scroll-reveal.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  </style>
</head>

<body class="text-gray-800 font-sans min-h-screen overflow-x-hidden">

<!-- NAV -->
<nav class="bg-white shadow-lg sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between">
    <a href="index.html" class="font-bold text-xl">Travel Tales</a>
  </div>
</nav>

<!-- BACKGROUND -->
<div class="fixed inset-0 -z-10">
  <div class="absolute inset-0 bg-cover bg-center"
    style="background-image: url('https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=1600&q=80');">
  </div>
  <div class="absolute inset-0 bg-black/30"></div>
</div>

<!-- LOGIN -->
<div id="trip-lock" class="fixed inset-0 flex items-center justify-center z-20">
  <form onsubmit="handleLogin(event)"
    class="bg-white/10 backdrop-blur-xl border border-white/30 rounded-2xl px-10 py-12 w-full max-w-md text-center shadow-2xl space-y-6">

    <h1 id="trip-title" class="text-4xl text-white font-bold">Trip</h1>

    <input id="trip-password" type="password" placeholder="Password"
      class="w-full px-5 py-3 rounded-full bg-white text-black"/>

    <button class="bg-blue-600 text-white py-3 w-full rounded-full">
      Unlock Trip
    </button>

    <p id="trip-error" class="text-red-300 hidden">Wrong password</p>
  </form>
</div>

<!-- CONTENT -->
<section class="relative z-10 max-w-4xl mx-auto px-4 py-20">
  <div id="trip-content" class="hidden space-y-16">
    <div id="trip-root"></div>
  </div>
</section>

<!-- SCRIPTS -->
<script src="spain.js"></script>
<script src="portugal.js"></script>
<script src="render.js"></script>

<script>
const TRIP_PASSWORDS = {
  spain: "Spain2026",
  portugal: "Portugal2026"
};

const params = new URLSearchParams(window.location.search);
const trip = params.get("trip");

// Dynamic title
const titleMap = {
  spain: "🇪🇸 Spain Trip",
  portugal: "🇵🇹 Portugal Trip"
};

document.getElementById("trip-title").innerText =
  titleMap[trip] || "Trip Access";

function handleLogin(e){
  e.preventDefault();

  const val = document.getElementById("trip-password").value;
  const error = document.getElementById("trip-error");
  const content = document.getElementById("trip-content");

  if(val === TRIP_PASSWORDS[trip]){

    // hide login
    document.getElementById("trip-lock").classList.add("hidden");

    // show content
    content.classList.remove("hidden");

    // render correct trip
    if(trip === "spain"){
      renderSpainTrip(spainTrip);
    }

    if(trip === "portugal"){
      renderSpainTrip(portugalTrip);
    }

    // welcome message
    const welcome = document.createElement("div");
    welcome.className = "scroll-reveal";

    welcome.innerHTML = `
      <div class="bg-white/60 backdrop-blur-md p-6 rounded-2xl shadow border border-white/30 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">
          👋 Welcome Dillon’s inner circle
        </h2>
        <p class="text-white/80">
          Let’s make this trip unforgettable ✈️
        </p>
      </div>
    `;

    content.prepend(welcome);

    setTimeout(() => welcome.classList.add("show"), 100);

    error.classList.add("hidden");

  } else {
    error.classList.remove("hidden");
  }
}
</script>

</body>
</html>
