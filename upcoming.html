<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <meta name="description" content="Upcoming adventures from Travel Tales of Dillon and Jovita.">
  <title>Upcoming Trips | Travel Tales of Dillon &amp; Jovita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=DM+Serif+Display:ital@0;1&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --ink:#17221f; --paper:#f8f3e9; --cream:#fffaf2; --coral:#ef5b35; --teal:#16858b; --gold:#e3a725; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); font-family:"DM Sans",sans-serif; background:var(--paper); }
    h1,h2,h3 { font-family:"DM Serif Display",serif; font-weight:400; }
    .site-nav { position:sticky; top:0; z-index:50; background:rgba(255,250,242,.9); border-bottom:1px solid rgba(23,34,31,.1); backdrop-filter:blur(16px); }
    .nav-inner { max-width:1120px; margin:auto; padding:15px 22px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .brand { display:flex; align-items:center; gap:11px; color:var(--ink); font-weight:700; text-decoration:none; }
    .brand-mark { width:38px; height:38px; display:grid; place-items:center; border-radius:50%; color:white; background:var(--coral); transform:rotate(-7deg); }
    .nav-back { color:var(--ink); text-decoration:none; font-size:.92rem; font-weight:700; padding:10px 15px; border-radius:999px; border:1px solid rgba(23,34,31,.14); background:white; }
    #bg-image { position:fixed; inset:0; z-index:-2; background-size:cover; background-position:center; }
    .page-wash { position:fixed; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(13,31,28,.42),rgba(13,31,28,.76)); }
    .lock-screen { min-height:calc(100vh - 69px); display:grid; place-items:center; padding:40px 20px; }
    .lock-card { width:min(470px,100%); padding:42px; text-align:center; color:white; border:1px solid rgba(255,255,255,.3); background:rgba(15,34,31,.46); backdrop-filter:blur(18px); border-radius:30px; box-shadow:0 26px 80px rgba(0,0,0,.28); }
    .lock-card .eyebrow { letter-spacing:.2em; text-transform:uppercase; color:#ffd39f; font-weight:700; font-size:.72rem; }
    .lock-card h1 { font-size:clamp(2.7rem,9vw,4.5rem); line-height:.95; margin:14px 0 8px; }
    .lock-card p { color:rgba(255,255,255,.78); margin:0 0 26px; }
    .password-row { display:flex; gap:10px; padding:7px; background:white; border-radius:999px; box-shadow:0 14px 40px rgba(0,0,0,.16); }
    .password-row input { min-width:0; flex:1; border:0; outline:0; padding:12px 16px; background:transparent; color:var(--ink); }
    .password-row button { border:0; border-radius:999px; padding:12px 20px; color:white; background:var(--coral); font-weight:700; cursor:pointer; }
    .trip-shell { max-width:1120px; margin:auto; padding:70px 22px 100px; }
    .trip-layout { display:grid; gap:78px; }
    .trip-hero { text-align:center; color:white; padding:48px 16px 14px; }
    .trip-kicker { margin:0 0 14px; text-transform:uppercase; letter-spacing:.25em; font-size:.78rem; font-weight:700; color:#ffd39f; }
    .trip-hero h1 { margin:0; font-size:clamp(4rem,11vw,7.5rem); line-height:.88; text-shadow:0 7px 30px rgba(0,0,0,.2); }
    .trip-hero > p:not(.trip-kicker) { font-size:clamp(1rem,3vw,1.35rem); color:rgba(255,255,255,.8); margin:17px 0 23px; }
    .hero-route { display:inline-flex; align-items:center; gap:18px; border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:10px 18px; background:rgba(255,255,255,.12); backdrop-filter:blur(10px); font-size:.78rem; font-weight:700; letter-spacing:.16em; }
    .glass-card { border:1px solid rgba(255,255,255,.58); background:rgba(255,250,242,.9); box-shadow:0 18px 55px rgba(10,29,26,.18); backdrop-filter:blur(14px); }
    .overview-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
    .overview-card { min-height:120px; padding:22px; border-radius:22px; display:flex; gap:16px; align-items:flex-start; }
    .overview-card > i { color:var(--coral); font-size:1.1rem; margin-top:3px; }
    .overview-card span,.card-label { display:block; text-transform:uppercase; letter-spacing:.14em; color:#6f7773; font-size:.68rem; font-weight:700; }
    .overview-card strong { display:block; margin-top:8px; font-size:1rem; line-height:1.35; }
    .trip-section { scroll-margin-top:90px; }
    .section-heading { color:white; display:flex; align-items:center; gap:17px; margin-bottom:24px; }
    .section-heading h2 { margin:0; font-size:clamp(2.3rem,5vw,3.6rem); line-height:1; }
    .section-heading p { color:rgba(255,255,255,.72); margin:7px 0 0; }
    .section-icon { width:48px; height:48px; flex:0 0 auto; display:grid; place-items:center; border-radius:15px; color:white; background:var(--coral); box-shadow:0 12px 30px rgba(239,91,53,.3); }
    .flight-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
    .stay-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:22px; }
    .transport-card,.stay-card { border-radius:26px; overflow:hidden; }
    .transport-card img,.stay-card img { width:100%; height:230px; display:block; object-fit:cover; }
    .card-body { padding:23px; }
    .card-body h3,.train-copy h3 { margin:8px 0 6px; font-size:1.55rem; line-height:1.15; }
    .card-body p,.train-copy p { color:#5e6762; margin:0; }
    .card-body small { display:block; color:#747b78; margin-top:8px; line-height:1.45; }
    .documents-cta { display:flex; align-items:center; gap:20px; padding:25px; border:1px solid rgba(255,255,255,.58); border-radius:26px; background:rgba(255,250,242,.94); box-shadow:0 18px 55px rgba(10,29,26,.18); }
    .documents-cta > div:nth-child(2) { flex:1; }
    .documents-cta h2 { margin:5px 0 4px; font-size:1.8rem; }
    .documents-cta p { color:#68716d; margin:0; }
    .documents-cta-icon { width:62px; height:62px; display:grid; place-items:center; flex:0 0 auto; border-radius:19px; color:white; background:var(--teal); font-size:1.35rem; }
    .train-card { display:flex; align-items:center; gap:20px; padding:24px; border-radius:25px; margin-top:22px; }
    .train-icon,.document-icon { width:58px; height:58px; display:grid; place-items:center; flex:0 0 auto; border-radius:18px; color:white; background:var(--teal); font-size:1.3rem; }
    .train-copy { flex:1; }
    .train-copy small { display:block; margin-top:8px; color:#747b78; }
    .trip-button,.text-link { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700; text-decoration:none; }
    .trip-button { color:white; background:var(--coral); padding:12px 17px; border-radius:999px; white-space:nowrap; }
    .trip-button.secondary { color:var(--teal); background:#e4f3f0; }
    .text-link { color:var(--coral); margin-top:18px; }
    .weather-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:22px; }
    .weather-city { border-radius:26px; padding:25px; }
    .weather-city-head { display:flex; justify-content:space-between; align-items:center; }
    .weather-city-head h3 { margin:6px 0 0; font-size:2rem; }
    .weather-city-head > i { color:var(--coral); }
    .weather-status { color:#69736e; margin-top:20px; }
    .weather-days { margin-top:20px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .weather-day { min-width:0; text-align:center; background:white; border:1px solid #ece5d9; border-radius:15px; padding:12px 6px; }
    .weather-day span,.weather-day small { display:block; color:#757d79; font-size:.68rem; }
    .weather-day i { display:block; color:var(--gold); font-size:1.2rem; margin:10px 0 8px; }
    .weather-day strong { display:block; font-size:1.2rem; }
    .weather-day small { margin-top:3px; line-height:1.3; }
    .weather-credit { color:rgba(255,255,255,.68); font-size:.78rem; margin:12px 4px 0; }
    .weather-credit a { color:white; }
    .document-list { display:grid; gap:17px; }
    .document-card { border-radius:25px; overflow:hidden; }
    .document-card summary { list-style:none; cursor:pointer; padding:22px; display:flex; align-items:center; gap:18px; }
    .document-card summary::-webkit-details-marker { display:none; }
    .document-card summary > div:nth-child(2) { flex:1; }
    .document-card h3 { margin:5px 0; font-size:1.45rem; }
    .document-card p { color:#69716d; margin:0; }
    .document-actions { display:flex; align-items:center; gap:18px; color:var(--teal); }
    .document-actions a { color:var(--teal); font-weight:700; text-decoration:none; white-space:nowrap; }
    .toggle-icon { transition:transform .2s ease; }
    details[open] .toggle-icon { transform:rotate(180deg); }
    .pdf-frame-wrap { padding:0 18px 18px; }
    .pdf-frame-wrap iframe { display:block; width:100%; height:680px; border:0; border-radius:16px; background:white; }
    .results-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
    .result-card { border-radius:20px; padding:19px 21px; }
    .result-person { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; }
    .result-person i { color:var(--coral); }
    .result-person strong { font-family:"DM Serif Display",serif; font-size:1.35rem; }
    .result-card p { color:#707874; margin:9px 0 0; font-size:.82rem; }
    .result-card p b { color:var(--ink); }
    .timeline { position:relative; display:grid; gap:18px; }
    .timeline:before { content:""; position:absolute; top:28px; bottom:28px; left:28px; width:1px; background:rgba(255,255,255,.45); }
    .timeline-row { position:relative; display:grid; grid-template-columns:58px 1fr; gap:20px; align-items:start; }
    .timeline-marker { width:58px; height:58px; display:grid; place-items:center; border-radius:50%; color:white; background:var(--coral); border:6px solid rgba(255,255,255,.25); box-shadow:0 10px 25px rgba(0,0,0,.18); z-index:1; }
    .timeline-marker span { font-family:"DM Serif Display",serif; font-size:1.05rem; }
    .timeline-card { border-radius:24px; padding:25px; }
    .timeline-card h3 { margin:7px 0 18px; font-size:1.65rem; }
    .timeline-card ul { list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(2,1fr); gap:11px 18px; }
    .timeline-card li { display:flex; gap:9px; align-items:flex-start; color:#505a55; font-size:.92rem; }
    .timeline-card li span { width:6px; height:6px; margin-top:7px; border-radius:50%; flex:0 0 auto; background:var(--teal); }
    .scroll-reveal { opacity:0; transform:translateY(28px); transition:opacity .7s ease,transform .7s ease; }
    .scroll-reveal.show { opacity:1; transform:none; }
    .planning-card { min-height:calc(100vh - 210px); display:grid; place-items:center; color:white; text-align:center; }
    .planning-card > div { max-width:650px; padding:50px; border-radius:30px; background:rgba(15,34,31,.45); border:1px solid rgba(255,255,255,.3); backdrop-filter:blur(18px); }
    .planning-card h1 { font-size:clamp(3.5rem,10vw,6.5rem); margin:12px 0; }
    .planning-card p { color:rgba(255,255,255,.8); font-size:1.1rem; }
    .welcome-card { margin-bottom:28px; padding:24px; text-align:center; color:white; border:1px solid rgba(255,255,255,.3); border-radius:22px; background:rgba(255,255,255,.16); backdrop-filter:blur(14px); box-shadow:0 14px 38px rgba(0,0,0,.16); }
    .welcome-card h2 { margin:0 0 5px; font-family:"DM Sans",sans-serif; font-size:1.5rem; font-weight:700; }
    .welcome-card p { margin:0; color:rgba(255,255,255,.82); }
    .hidden { display:none !important; }
    @media (max-width:850px) {
      .overview-grid { grid-template-columns:repeat(2,1fr); }
      .flight-grid,.stay-grid,.weather-grid { grid-template-columns:1fr; }
      .documents-cta { align-items:flex-start; flex-wrap:wrap; }
      .documents-cta > div:nth-child(2) { min-width:calc(100% - 90px); }
      .documents-cta .trip-button { margin-left:82px; }
      .train-card { align-items:flex-start; flex-wrap:wrap; }
      .train-copy { min-width:calc(100% - 80px); }
      .train-card .trip-button { margin-left:78px; }
      .pdf-frame-wrap iframe { height:560px; }
    }
    @media (max-width:620px) {
      .nav-inner { padding:12px 16px; }
      .brand span:last-child { font-size:.88rem; }
      .nav-back { font-size:0; width:42px; height:42px; padding:0; display:grid; place-items:center; }
      .nav-back i { font-size:.9rem; }
      .trip-shell { padding:45px 14px 80px; }
      .trip-layout { gap:58px; }
      .overview-grid,.results-grid { grid-template-columns:1fr; }
      .overview-card { min-height:0; }
      .section-heading { align-items:flex-start; }
      .section-heading p { font-size:.9rem; }
      .weather-days { grid-template-columns:repeat(2,1fr); }
      .document-card summary { align-items:flex-start; flex-wrap:wrap; }
      .document-card summary > div:nth-child(2) { width:calc(100% - 80px); }
      .document-actions { width:100%; justify-content:space-between; padding-left:76px; }
      .pdf-frame-wrap { padding:0 10px 10px; }
      .pdf-frame-wrap iframe { height:480px; }
      .timeline-row { grid-template-columns:46px 1fr; gap:10px; }
      .timeline:before { left:22px; }
      .timeline-marker { width:46px; height:46px; border-width:4px; }
      .timeline-card { padding:20px; }
      .timeline-card ul { grid-template-columns:1fr; }
      .lock-card { padding:34px 22px; }
      .password-row { border-radius:22px; flex-direction:column; }
      .password-row button { width:100%; }
      .documents-cta { padding:21px; }
      .documents-cta-icon { width:50px; height:50px; }
      .documents-cta > div:nth-child(2) { min-width:calc(100% - 70px); }
      .documents-cta .trip-button { margin-left:0; width:100%; }
    }
  </style>
  <link rel="stylesheet" href="assets/site-theme.css">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html"><span class="brand-mark"><i class="fas fa-compass"></i></span><span>Travel Tales of Dillon &amp; Jovita</span></a>
      <a class="nav-back" href="index.html#portfolio"><i class="fas fa-arrow-left"></i> <span>Back to journeys</span></a>
    </div>
  </nav>
  <div id="bg-image"></div><div class="page-wash"></div>
  <main>
    <section id="trip-lock" class="lock-screen">
      <form class="lock-card" onsubmit="handleLogin(event)">
        <span class="eyebrow">Private trip plan</span>
        <h1 id="trip-title">España</h1>
        <p>Enter the group password to open the itinerary.</p>
        <div class="password-row"><input id="trip-password" type="password" placeholder="Trip password" autocomplete="current-password" required><button type="submit">Unlock <i class="fas fa-arrow-right"></i></button></div>
        <p id="trip-error" class="hidden" role="alert" aria-live="polite" style="margin:16px 0 0;color:#ffd1c5;font-weight:700;">That password didn’t match. Try again.</p>
      </form>
    </section>
    <section id="trip-content" class="trip-shell hidden"><div id="trip-root"></div></section>
  </main>
  <script src="render.js"></script>
  <script>
    const tripMeta = {
      spain: { title: "España", background: "https://images.unsplash.com/photo-1725208179317-c5e56702816a?auto=format&fit=crop&w=2000&q=88" },
      france: { title: "France", background: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=2000&q=88", copy: "A French chapter is taking shape. Routes, dates and favourite stops will appear here as plans settle." },
      finland: { title: "Finland", background: "https://images.unsplash.com/photo-1483347756197-71ef80e95f73?auto=format&fit=crop&w=2000&q=88", copy: "Nordic light, quiet forests and a little winter magic. The full Finland plan is coming soon." }
    };
    const requestedTrip = new URLSearchParams(window.location.search).get("trip") || "spain";
    const trip = Object.prototype.hasOwnProperty.call(tripMeta, requestedTrip) ? requestedTrip : "spain";
    const protectedTrips = new Set(["spain", "portugal"]);
    const activeMeta = tripMeta[trip];
    document.getElementById("bg-image").style.backgroundImage = `url('${activeMeta.background}')`;
    document.getElementById("trip-title").textContent = activeMeta.title;

    if (!protectedTrips.has(trip)) {
      document.getElementById("trip-lock").classList.add("hidden");
      const content = document.getElementById("trip-content");
      content.classList.remove("hidden");
      content.innerHTML = `<div class="planning-card"><div><span class="trip-kicker">Upcoming journey</span><h1>${activeMeta.title}</h1><p>${activeMeta.copy}</p><a class="trip-button" href="index.html#portfolio" style="margin-top:20px;">See all upcoming trips <i class="fas fa-arrow-right"></i></a></div></div>`;
    }

    async function handleLogin(event) {
      event.preventDefault();

      const passwordInput = document.getElementById("trip-password");
      const error = document.getElementById("trip-error");
      const content = document.getElementById("trip-content");
      const submitButton = event.currentTarget.querySelector('button[type="submit"]');
      const originalButtonHtml = submitButton.innerHTML;

      error.classList.add("hidden");
      submitButton.disabled = true;
      submitButton.textContent = "Checking…";

      try {
        const response = await fetch("/.netlify/functions/checkPassword", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ trip, password: passwordInput.value })
        });

        let payload;

        try {
          payload = await response.json();
        } catch (parseError) {
          throw new Error("The access service returned an invalid response.");
        }

        if (!response.ok || !payload.success || !payload.trip) {
          if (response.status === 401) {
            error.textContent = "That password didn’t match. Try again.";
          } else if (response.status === 503) {
            error.textContent = "Trip access isn’t configured yet. Please contact Dillon or Jovita.";
          } else {
            error.textContent = "We couldn’t unlock the trip right now. Please try again.";
          }
          error.classList.remove("hidden");
          return;
        }

        renderTrip(payload.trip);

        const welcome = document.createElement("div");
        welcome.className = "welcome-card scroll-reveal";
        welcome.innerHTML = `<h2>Welcome to Dillon and Jovita’s inner circle</h2><p>Let’s make this trip unforgettable ✈️</p>`;
        content.prepend(welcome);

        document.getElementById("trip-lock").classList.add("hidden");
        content.classList.remove("hidden");
        passwordInput.value = "";
        setTimeout(() => welcome.classList.add("show"), 100);
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (requestError) {
        console.error(requestError);
        error.textContent = "We couldn’t reach the trip access service. Please try again.";
        error.classList.remove("hidden");
      } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = originalButtonHtml;
      }
    }
  </script>
  <script src="assets/site-enhancements.js"></script>
</body>
</html>
