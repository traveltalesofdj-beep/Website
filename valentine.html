<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 28px 24px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 10px 0 6px;
    }

    /* GIF */
    .valentine-gif {
      display: block;
      margin: 12px auto 18px;
      width: min(220px, 70%);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,.15);
      animation: fadeUp .4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 26px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
    }

    #yesBtn:hover {
      background: var(--yesHover);
    }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
      pointer-events: none; /* NEVER clickable */
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <h1>Jovita !! will you be my valentine? 💖</h1>

    <!-- ASKING GIF -->
    <img
      id="askGif"
      class="valentine-gif"
      src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmx5amFmcGNlY25jaGxsNmdwYmxqNWlzdG41cnhmaHJnNnp0bGJ0NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/elhmwUMsAUbScKLLzl/giphy.gif"
      alt="Cute Valentine GIF"
    />

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint">“No” is feeling shy 😈</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img
        src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDQzZ2tocWdxeWhja2I4eHlrdXg5NjN1amRzbmxvcGo4cWpkZjN4YyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/11sBLVxNs7v6WA/giphy.gif"
        width="300"
        alt="Celebration"
      />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const askGif = document.getElementById("askGif");
    const confettiCanvas = document.getElementById("confettiCanvas");

    /* CONFETTI */
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      confettiCanvas.width = innerWidth * dpr;
      confettiCanvas.height = innerHeight * dpr;
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function fireConfetti() {
      const end = Date.now() + 1600;
      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 100,
          startVelocity: 45,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    /* EVIL BUTTON LOGIC */
    let yesScale = 1;
    let noScale = 1;

    function growYes() {
      yesScale = Math.min(2.4, yesScale + 0.12);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    function shrinkNo() {
      noScale = Math.max(0.35, noScale - 0.12);
      noBtn.style.transform = `scale(${noScale})`;
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(x, y) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - x;
      let dy = (b.top + b.height / 2) - y;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      let left = (b.left - z.left) + dx * 140;
      let top  = (b.top - z.top) + dy * 140;

      left = clamp(left, 0, z.width - b.width);
      top  = clamp(top, 0, z.height - b.height);

      noBtn.style.left = left + "px";
      noBtn.style.top = top + "px";

      growYes();
      shrinkNo();
    }

    function handleMove(x, y) {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - x,
        (b.top + b.height / 2) - y
      );
      if (d < 160) moveNo(x, y);
    }

    /* Desktop */
    zone.addEventListener("pointermove", e => {
      handleMove(e.clientX, e.clientY);
    });

    /* Mobile */
    zone.addEventListener("touchstart", e => {
      handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    zone.addEventListener("touchmove", e => {
      handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    /* YES CLICK */
    yesBtn.addEventListener("click", () => {
      askGif.style.display = "none";
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeCanvas();
      fireConfetti();
    });
  </script>
</body>
</html>
